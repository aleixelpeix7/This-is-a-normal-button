<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dodging Button</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
      overflow: hidden;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #trickyButton {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 32px;
      font-size: 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: transform 0.1s ease-out, background 0.2s;
    }

    #trickyButton:hover {
      background: #2563eb;
    }

    #message {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #9ca3af;
      text-align: center;
      padding: 6px 12px;
      background: rgba(15,23,42,0.8);
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.4);
    }
  </style>
</head>
<body>
  <div id="container">
    <button id="trickyButton">Click me</button>
    <div id="message">Try to click the button… if you can.</div>
  </div>

  <script>
    const button = document.getElementById('trickyButton');
    const container = document.getElementById('container');

    function moveButton() {
      const containerRect = container.getBoundingClientRect();
      const buttonRect = button.getBoundingClientRect();

      const maxX = containerRect.width - buttonRect.width;
      const maxY = containerRect.height - buttonRect.height;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      button.style.left = randomX + 'px';
      button.style.top = randomY + 'px';
      button.style.transform = 'translate(0, 0)';
    }

    // Move when the mouse gets close
    button.addEventListener('mousemove', (e) => {
      const rect = button.getBoundingClientRect();
      const distanceX = Math.abs(e.clientX - (rect.left + rect.width / 2));
      const distanceY = Math.abs(e.clientY - (rect.top + rect.height / 2));
      const threshold = 60; // how close you can get before it runs away

      if (distanceX < threshold && distanceY < threshold) {
        moveButton();
      }
    });

    // Just in case someone actually clicks it
    button.addEventListener('click', () => {
      alert("Wow, you actually clicked it!");
    });

    // Keep it inside the window on resize
    window.addEventListener('resize', () => {
      moveButton();
    });
  </script>
</body>
</html>
