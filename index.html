<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retro Button Challenge</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #f2f2f2;
    font-family: "Times New Roman", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* Retro window frame */
  .window {
    width: 500px;
    height: 300px;
    background: #ffffff;
    border: 3px solid #000;
    box-shadow: 6px 6px 0px #000;
    position: relative;
    padding-top: 30px;
  }

  .titlebar {
    background: #000080;
    color: white;
    padding: 5px 10px;
    font-size: 14px;
    position: absolute;
    top: 0;
    left: 0;
    width: calc(100% - 20px);
  }

  #btn {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 10px 25px;
    font-size: 18px;
    background: #d9d9d9;
    border: 2px solid #000;
    cursor: pointer;
    transition: left 0.35s ease, top 0.35s ease;
  }

  #btn:active {
    background: #c0c0c0;
  }

  .text {
    text-align: center;
    margin-top: 40px;
    font-size: 18px;
  }
</style>
</head>

<body>

<div class="window">
  <div class="titlebar">Retro Button Challenge</div>
  <div class="text">Try clicking the button.</div>
  <button id="btn">Click me</button>
</div>

<script>
  const btn = document.getElementById("btn");
  const win = document.querySelector(".window");

  function moveButtonSmooth() {
    const maxX = win.clientWidth - btn.offsetWidth - 10;
    const maxY = win.clientHeight - btn.offsetHeight - 10;

    const newX = Math.random() * maxX + 5;
    const newY = Math.random() * maxY + 35;

    btn.style.left = newX + "px";
    btn.style.top = newY + "px";
  }

  // Escape earlier and smoothly
  document.addEventListener("mousemove", (e) => {
    const rect = btn.getBoundingClientRect();
    const distX = Math.abs(e.clientX - (rect.left + rect.width / 2));
    const distY = Math.abs(e.clientY - (rect.top + rect.height / 2));

    const threshold = 200; // escapes MUCH earlier

    if (distX < threshold && distY < threshold) {
      moveButtonSmooth();
    }
  });

  // Redirect if clicked
  btn.addEventListener("click", () => {
    window.location.href = "https://thisisanormalbutton.netlify.app/surprise";
  });
</script>

</body>
</html>
