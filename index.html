<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Totally Normal Button</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: url("assets/XpBg.png") center/cover no-repeat;
    font-family: Tahoma, sans-serif;
    overflow: hidden;
  }

  /* Container for the XP window image */
  .window {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 720px; /* ajusta segons la mida real */
    pointer-events: none; /* perquè no bloquegi el botó */
  }

  .window img {
    width: 100%;
    display: block;
    user-select: none;
  }

  /* XP-style top text */
  .xp-text {
    position: absolute;
    top: 105px; /* ajusta segons la imatge */
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: #3d3d3d;
    text-shadow: 1px 1px 0 #ffffff;
    pointer-events: none;
  }

  /* Dodging button */
  #btn {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 10px 25px;
    font-size: 16px;
    background: #e1e1e1;
    border: 2px solid #7f9db9;
    border-radius: 3px;
    cursor: pointer;
  }

  #btn:active {
    background: #d0d0d0;
  }
</style>
</head>

<body>

<audio id="errSound" src="assets/XpErr.mp3" preload="auto"></audio>

<div class="window">
  <img src="assets/window.png" alt="XP Window">
  <div class="xp-text">This is a totally normal button.</div>
</div>

<button id="btn">Click me</button>

<script>
  const btn = document.getElementById("btn");
  const errSound = document.getElementById("errSound");

  function moveButton() {
    const maxX = window.innerWidth - btn.offsetWidth;
    const maxY = window.innerHeight - btn.offsetHeight;

    const newX = Math.random() * maxX;
    const newY = Math.random() * maxY;

    btn.style.left = newX + "px";
    btn.style.top = newY + "px";
    btn.style.transform = "translate(0, 0)";

    errSound.currentTime = 0;
    errSound.play();
  }

  // Escape only when VERY close
  document.addEventListener("mousemove", (e) => {
    const rect = btn.getBoundingClientRect();
    const distX = Math.abs(e.clientX - (rect.left + rect.width / 2));
    const distY = Math.abs(e.clientY - (rect.top + rect.height / 2));

    const threshold = 70;

    if (distX < threshold && distY < threshold) {
      moveButton();
    }
  });

  btn.addEventListener("click", () => {
    window.location.href = "https://thisisanormalbutton.netlify.app/surprise";
  });
</script>

</body>
</html>
