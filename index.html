<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Windows XP Login</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #000;
    font-family: Tahoma, sans-serif;
    overflow: hidden;
  }

  #loginScreen {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url("assets/XpLogin.png") center no-repeat;
    background-size: 100% 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #userIcon {
    width: 220px;
    height: 70px;
    background: url("assets/XpUser.png") center/cover no-repeat;
    cursor: pointer;
  }

  #desktop {
    width: 100%;
    height: 100%;
    background: url("assets/XpBg.png") center no-repeat;
    background-size: 100% 100%;
    position: absolute;
    top: 0;
    left: 0;
    display: none;
  }

  #ui {
    display: none;
    pointer-events: none;
  }

  #ui.visible {
    display: block;
    pointer-events: auto;
  }

  .window {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 720px;
    pointer-events: none;
  }

  .window img {
    width: 100%;
    display: block;
    user-select: none;
  }

  .title-text {
    position: absolute;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: white;
    font-weight: bold;
    text-shadow: 1px 1px 0 #00000055;
  }

  .search-text {
    position: absolute;
    top: 45px;
    left: 95px;
    font-size: 13px;
    color: #3d3d3d;
    text-shadow: 1px 1px 0 #ffffff;
    white-space: nowrap;
  }

  .window-content {
    position: absolute;
    left: 20px;
    top: 70px;
    right: 20px;
    bottom: 20px;
    text-align: center;
  }

  .prize-line {
    position: absolute;
    top: 45px;
    left: 285px;
    font-size: 20px;
    color: #3d3d3d;
    text-shadow: 1px 1px 0 #ffffff;
  }

  .stats-line {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    color: #3d3d3d;
    text-shadow: 1px 1px 0 #ffffff;
    white-space: nowrap;
  }

  #visitorText { top: 110px; }
  #clicksText { top: 140px; }

  #btn {
    position: absolute;
    left: 770px;
    top: 370px;
    transform: translate(-50%, -50%);
    padding: 10px 25px;
    font-size: 16px;
    background: #e1e1e1;
    border: 2px solid #7f9db9;
    border-radius: 3px;
    cursor: pointer;
  }
</style>
</head>

<body>

<div id="loginScreen">
  <div id="userIcon"></div>
</div>

<div id="desktop"></div>

<audio id="startupSound" src="assets/XpStartup.wav"></audio>
<audio id="logonSound" src="assets/xplogon.wav"></audio>
<audio id="errSound" src="assets/XpErr.mp3" preload="auto"></audio>

<div id="ui">

  <div class="window">
    <img src="assets/window.png" alt="XP Window">

    <div class="title-text">Totally normal window</div>
    <div class="search-text">This is a totally normal button.</div>

    <div class="window-content">
        <p class="prize-line">⬇Click this button to get a prize⬇</p>

        <p id="visitorText" class="stats-line">Loading visitor number...</p>
        <p id="clicksText" class="stats-line">Loading click stats...</p>
    </div>
  </div>

  <button id="btn">Click me</button>

</div>

<script>
  async function registerVisit() {
    const res = await fetch("/.netlify/functions/countVisit");
    const data = await res.json();
    return data.total;
  }

  async function registerClick() {
    const res = await fetch("/.netlify/functions/countClick");
    const data = await res.json();
    return data.clicks;
  }

  async function loadStats() {
    const visits = await fetch("/.netlify/functions/countVisit").then(r => r.json());
    const clicks = await fetch("/.netlify/functions/countClick").then(r => r.json());

    document.getElementById("visitorText").textContent =
      `You are visitor number ${visits.total}`;

    document.getElementById("clicksText").textContent =
      `${clicks.clicks} people have managed to click`;
  }

  const loginScreen = document.getElementById("loginScreen");
  const desktop = document.getElementById("desktop");
  const ui = document.getElementById("ui");
  const startupSound = document.getElementById("startupSound");
  const logonSound = document.getElementById("logonSound");
  const errSound = document.getElementById("errSound");
  const btn = document.getElementById("btn");
  const userIcon = document.getElementById("userIcon");

  let buttonEnabled = false;

  userIcon.onclick = async () => {
    loginScreen.style.display = "none";
    desktop.style.display = "block";

    await registerVisit();
    await loadStats();

    startupSound.play();

    setTimeout(() => {
      setTimeout(() => {
        ui.classList.add("visible");
        buttonEnabled = true;
        logonSound.play();
      }, 2000);
    }, 4000);
  };

  function moveButton() {
    if (!buttonEnabled) return;

    const maxX = window.innerWidth - btn.offsetWidth;
    const maxY = window.innerHeight - btn.offsetHeight;

    btn.style.left = Math.random() * maxX + "px";
    btn.style.top = Math.random() * maxY + "px";

    errSound.currentTime = 0;
    errSound.play();
  }

  document.addEventListener("mousemove", (e) => {
    if (!buttonEnabled) return;

    const rect = btn.getBoundingClientRect();
    const distX = Math.abs(e.clientX - (rect.left + rect.width / 2));
    const distY = Math.abs(e.clientY - (rect.top + rect.height / 2));

    if (distX < 70 && distY < 70) moveButton();
  });

  btn.addEventListener("click", async () => {
    if (!buttonEnabled) return;

    await registerClick();
    await loadStats();

    window.location.href = "https://thisisanormalbutton.netlify.app/surprise";
  });

  loadStats();
</script>

</body>
</html>
