<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Windows XP Login</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #000;
    font-family: Tahoma, sans-serif;
    overflow: hidden;
  }

  /* LOGIN SCREEN */
  #loginScreen {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url("assets/XpLogin.png") center no-repeat;
    background-size: 100% 100%; /* IMPORTANT: s’ajusta a la pantalla */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* XP user icon (from your uploaded image) */
  #userIcon {
    width: 220px;
    height: 70px;
    background: url("assets/XpUser.png") center/cover no-repeat;
    cursor: pointer;
  }

  /* UI hidden until startup sound ends */
  #ui.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #ui.fade-in {
    opacity: 1;
    transition: opacity 0.6s ease-in-out;
    pointer-events: auto;
  }

  /* Desktop background */
  #desktop {
    width: 100%;
    height: 100%;
    background: url("assets/XpBg.png") center/cover no-repeat;
    position: absolute;
    top: 0;
    left: 0;
  }

  /* Window container */
  .window {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 720px;
    pointer-events: none;
  }

  .window img {
    width: 100%;
    display: block;
    user-select: none;
  }

  /* Title bar text */
  .title-text {
    position: absolute;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: white;
    font-weight: bold;
    text-shadow: 1px 1px 0 #00000055;
    pointer-events: none;
  }

  /* Search bar text */
  .search-text {
    position: absolute;
    top: 45px;
    left: 95px;
    font-size: 13px;
    color: #3d3d3d;
    text-shadow: 1px 1px 0 #ffffff;
    pointer-events: none;
    white-space: nowrap;
  }

  /* Dodging button */
  #btn {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 10px 25px;
    font-size: 16px;
    background: #e1e1e1;
    border: 2px solid #7f9db9;
    border-radius: 3px;
    cursor: pointer;
  }
</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div id="userIcon"></div>
</div>

<!-- STARTUP SOUND -->
<audio id="startupSound" src="assets/XpStartup.wav"></audio>

<!-- ERROR SOUND -->
<audio id="errSound" src="assets/XpErr.mp3" preload="auto"></audio>

<!-- DESKTOP + WINDOW (hidden initially) -->
<div id="ui" class="hidden">

  <div id="desktop"></div>

  <div class="window">
    <img src="assets/window.png" alt="XP Window">

    <div class="title-text">Totally normal window</div>

    <div class="search-text">This is a totally normal button.</div>
  </div>

  <button id="btn">Click me</button>

</div>

<script>
  const loginScreen = document.getElementById("loginScreen");
  const userIcon = document.getElementById("userIcon");
  const ui = document.getElementById("ui");
  const startupSound = document.getElementById("startupSound");
  const errSound = document.getElementById("errSound");
  const btn = document.getElementById("btn");

  /* NEW: block button until desktop appears */
  let buttonEnabled = false;

  /* --- LOGIN CLICK --- */
  userIcon.onclick = () => {
    loginScreen.style.display = "none";
    startupSound.play();

    // XP startup lasts exactly 4 seconds
    setTimeout(() => {
      ui.classList.remove("hidden");
      ui.classList.add("fade-in");
      buttonEnabled = true; // NOW the button activates
    }, 4000);
  };

  /* --- BUTTON ESCAPE --- */
  function moveButton() {
    if (!buttonEnabled) return; // NEW: block movement before desktop

    const maxX = window.innerWidth - btn.offsetWidth;
    const maxY = window.innerHeight - btn.offsetHeight;

    const newX = Math.random() * maxX;
    const newY = Math.random() * maxY;

    btn.style.left = newX + "px";
    btn.style.top = newY + "px";

    errSound.currentTime = 0;
    errSound.play();
  }

  document.addEventListener("mousemove", (e) => {
    if (!buttonEnabled) return; // NEW: block detection before desktop

    const rect = btn.getBoundingClientRect();
    const distX = Math.abs(e.clientX - (rect.left + rect.width / 2));
    const distY = Math.abs(e.clientY - (rect.top + rect.height / 2));

    const threshold = 70;

    if (distX < threshold && distY < threshold) {
      moveButton();
    }
  });

  btn.addEventListener("click", () => {
    if (!buttonEnabled) return;
    window.location.href = "https://thisisanormalbutton.netlify.app/surprise";
  });
</script>

</body>
</html>
