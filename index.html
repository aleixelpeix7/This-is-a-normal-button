<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retro Dodging Button</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: black;
    color: #33ff33;
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;

    /* CRT effect */
    text-shadow: 0 0 5px #33ff33;
  }

  .scanlines {
    position: fixed;
    pointer-events: none;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.15) 3px
    );
    z-index: 10;
  }

  #btn {
    position: absolute;
    padding: 14px 32px;
    font-size: 20px;
    background: black;
    border: 2px solid #33ff33;
    color: #33ff33;
    cursor: pointer;
    transition: left 0.25s ease, top 0.25s ease;
    box-shadow: 0 0 10px #33ff33;
  }

  #btn:hover {
    background: #033003;
  }

  #title {
    position: absolute;
    top: 30px;
    font-size: 22px;
    text-align: center;
    width: 100%;
  }
</style>
</head>

<body>

<div id="title">Try clicking the button… if you can.</div>

<button id="btn">Click me</button>

<div class="scanlines"></div>

<script>
  const btn = document.getElementById("btn");

  function moveButton() {
    const maxX = window.innerWidth - btn.offsetWidth;
    const maxY = window.innerHeight - btn.offsetHeight;

    const newX = Math.random() * maxX;
    const newY = Math.random() * maxY;

    btn.style.left = newX + "px";
    btn.style.top = newY + "px";
  }

  // Escape earlier (bigger detection radius)
  document.addEventListener("mousemove", (e) => {
    const rect = btn.getBoundingClientRect();
    const distX = Math.abs(e.clientX - (rect.left + rect.width / 2));
    const distY = Math.abs(e.clientY - (rect.top + rect.height / 2));

    const threshold = 150; // escapes sooner

    if (distX < threshold && distY < threshold) {
      moveButton();
    }
  });

  // If clicked, redirect
  btn.addEventListener("click", () => {
    window.location.href = "https://thisisanormalbutton.netlify.app/surprise";
  });

  // Initial center position
  moveButton();
</script>

</body>
</html>
