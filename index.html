<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Totally Normal Button</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: url("assets/XpBg.png") center/cover no-repeat;
    font-family: Tahoma, sans-serif;
    overflow: hidden;
  }

  /* FULL Windows XP window replica */
  .window {
    width: 640px;
    height: 420px;
    background: #ffffff;
    border: 2px solid #0a246a;
    box-shadow: 0 0 0 3px #3a6ea5, 6px 6px 0px rgba(0,0,0,0.4);
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  /* Title bar identical to XP */
  .titlebar {
    height: 30px;
    background: linear-gradient(to bottom, #1f5ab7, #174a96);
    display: flex;
    align-items: center;
    padding: 0 8px;
    color: white;
    font-weight: bold;
    font-size: 14px;
    border-bottom: 1px solid #0a246a;
    justify-content: space-between;
  }

  /* XP control buttons */
  .title-buttons {
    display: flex;
    gap: 4px;
  }

  .title-btn {
    width: 20px;
    height: 20px;
    background: #dcdcdc;
    border: 1px solid #404040;
    font-size: 14px;
    text-align: center;
    line-height: 18px;
    cursor: pointer;
    user-select: none;
  }

  /* XP navigation bar */
  .nav {
    background: #ece9d8;
    height: 42px;
    border-bottom: 1px solid #b4b4b4;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 10px;
  }

  .nav-btn {
    width: 30px;
    height: 30px;
    background: #3cb371;
    border-radius: 50%;
    border: 2px solid #1f5a1f;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
    font-size: 18px;
    user-select: none;
  }

  .address-bar {
    flex: 1;
    height: 28px;
    background: white;
    border: 2px inset #d0d0d0;
  }

  .text {
    text-align: center;
    margin-top: 40px;
    font-size: 18px;
    color: #000;
  }

  /* The dodging button */
  #btn {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 10px 25px;
    font-size: 16px;
    background: #e1e1e1;
    border: 2px solid #7f9db9;
    border-radius: 3px;
    cursor: pointer;
  }

  #btn:active {
    background: #d0d0d0;
  }
</style>
</head>

<body>

<div class="window">
  <div class="titlebar">
    <span>Totally Normal Window</span>

    <div class="title-buttons">
      <div class="title-btn">−</div>
      <div class="title-btn">□</div>
      <div class="title-btn">×</div>
    </div>
  </div>

  <div class="nav">
    <div class="nav-btn">←</div>
    <div class="nav-btn">→</div>
    <div class="address-bar"></div>
  </div>

  <div class="text">This is a totally normal button.</div>
</div>

<button id="btn">Click me</button>

<script>
  const btn = document.getElementById("btn");

  function moveButton() {
    const maxX = window.innerWidth - btn.offsetWidth;
    const maxY = window.innerHeight - btn.offsetHeight;

    const newX = Math.random() * maxX;
    const newY = Math.random() * maxY;

    btn.style.left = newX + "px";
    btn.style.top = newY + "px";
    btn.style.transform = "translate(0, 0)";
  }

  // Escape only when REALLY close
  document.addEventListener("mousemove", (e) => {
    const rect = btn.getBoundingClientRect();
    const distX = Math.abs(e.clientX - (rect.left + rect.width / 2));
    const distY = Math.abs(e.clientY - (rect.top + rect.height / 2));

    const threshold = 90; // MUCH closer than before

    if (distX < threshold && distY < threshold) {
      moveButton();
    }
  });

  // Redirect if clicked
  btn.addEventListener("click", () => {
    window.location.href = "https://thisisanormalbutton.netlify.app/surprise";
  });
</script>

</body>
</html>
