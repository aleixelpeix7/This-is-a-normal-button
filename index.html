<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Totally Normal Button</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #3a6ea5; /* Windows XP blue */
    font-family: Tahoma, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .window {
    width: 480px;
    height: 260px;
    background: #ece9d8;
    border: 2px solid #0a246a;
    box-shadow: 0 0 0 3px #3a6ea5, 6px 6px 0px rgba(0,0,0,0.4);
    position: relative;
  }

  .titlebar {
    background: linear-gradient(to bottom, #1f5ab7, #174a96);
    color: white;
    padding: 6px 10px;
    font-size: 14px;
    font-weight: bold;
    border-bottom: 1px solid #0a246a;
  }

  .text {
    text-align: center;
    margin-top: 35px;
    font-size: 18px;
    color: #000;
  }

  #btn {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 8px 22px;
    font-size: 16px;
    background: #e1e1e1;
    border: 2px solid #7f9db9;
    border-radius: 3px;
    cursor: pointer;
  }

  #btn:active {
    background: #d0d0d0;
  }
</style>
</head>

<body>

<div class="window">
  <div class="titlebar">Totally Normal Window</div>
  <div class="text">This is a totally normal button.</div>
  <button id="btn">Click me</button>
</div>

<script>
  const btn = document.getElementById("btn");
  const win = document.querySelector(".window");

  function moveButton() {
    const maxX = win.clientWidth - btn.offsetWidth - 10;
    const maxY = win.clientHeight - btn.offsetHeight - 10;

    const newX = Math.random() * maxX + 5;
    const newY = Math.random() * maxY + 35;

    btn.style.left = newX + "px";
    btn.style.top = newY + "px";
    btn.style.transform = "translate(0, 0)";
  }

  // Escape earlier, like the first version
  document.addEventListener("mousemove", (e) => {
    const rect = btn.getBoundingClientRect();
    const distX = Math.abs(e.clientX - (rect.left + rect.width / 2));
    const distY = Math.abs(e.clientY - (rect.top + rect.height / 2));

    const threshold = 150; // earlier escape

    if (distX < threshold && distY < threshold) {
      moveButton();
    }
  });

  // Redirect if clicked
  btn.addEventListener("click", () => {
    window.location.href = "https://thisisanormalbutton.netlify.app/surprise";
  });
</script>

</body>
</html>
