<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Totally normal window</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: url("assets/XpBg.png") center/cover no-repeat;
    font-family: Tahoma, sans-serif;
    overflow: hidden;
  }

  /* Hidden by default */
  .hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* Fade-in animation */
  .fade-in {
    opacity: 1;
    transition: opacity 0.6s ease-in-out;
    pointer-events: auto;
  }

  /* Window container */
  .window {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 720px;
    pointer-events: none;
  }

  .window img {
    width: 100%;
    display: block;
    user-select: none;
  }

  /* Title bar text */
  .title-text {
    position: absolute;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: white;
    font-weight: bold;
    text-shadow: 1px 1px 0 #00000055;
    pointer-events: none;
  }

  /* Search bar text */
  .search-text {
    position: absolute;
    top: 45px;
    left: 95px;
    font-size: 13px;
    color: #3d3d3d;
    text-shadow: 1px 1px 0 #ffffff;
    pointer-events: none;
    white-space: nowrap;
  }

  /* Dodging button */
  #btn {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 10px 25px;
    font-size: 16px;
    background: #e1e1e1;
    border: 2px solid #7f9db9;
    border-radius: 3px;
    cursor: pointer;
  }

  #btn:active {
    background: #d0d0d0;
  }
</style>
</head>

<body>

<!-- Startup sound -->
<audio id="startupSound" src="assets/XpStartup.wav"></audio>

<!-- Error sound -->
<audio id="errSound" src="assets/XpErr.mp3" preload="auto"></audio>

<!-- Everything starts hidden -->
<div id="ui" class="hidden">

  <div class="window">
    <img src="assets/window.png" alt="XP Window">

    <div class="title-text">Totally normal window</div>

    <div class="search-text">This is a totally normal button.</div>
  </div>

  <button id="btn">Click me</button>

</div>

<script>
  const ui = document.getElementById("ui");
  const startupSound = document.getElementById("startupSound");
  const errSound = document.getElementById("errSound");
  const btn = document.getElementById("btn");

  /* --- INTRO XP --- */
  window.onload = () => {
    startupSound.play();

    // Duració exacta del so XP Startup: 4.0s
    setTimeout(() => {
      ui.classList.remove("hidden");
      ui.classList.add("fade-in");
    }, 4000);
  };

  /* --- BUTTON ESCAPE --- */
  function moveButton() {
    const maxX = window.innerWidth - btn.offsetWidth;
    const maxY = window.innerHeight - btn.offsetHeight;

    const newX = Math.random() * maxX;
    const newY = Math.random() * maxY;

    btn.style.left = newX + "px";
    btn.style.top = newY + "px";
    btn.style.transform = "translate(0, 0)";

    errSound.currentTime = 0;
    errSound.play();
  }

  document.addEventListener("mousemove", (e) => {
    const rect = btn.getBoundingClientRect();
    const distX = Math.abs(e.clientX - (rect.left + rect.width / 2));
    const distY = Math.abs(e.clientY - (rect.top + rect.height / 2));

    const threshold = 70;

    if (distX < threshold && distY < threshold) {
      moveButton();
    }
  });

  btn.addEventListener("click", () => {
    window.location.href = "https://thisisanormalbutton.netlify.app/surprise";
  });
</script>

</body>
</html>
